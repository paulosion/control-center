[phases.setup]
nixPkgs = ["php83", "php83Extensions.pgsql", "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.curl", "php83Extensions.zip", "php83Packages.composer"]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader"]

[start]
# Config/route/view caches are built here, at start, not in the build
# phase, so they always use the service's current Railway variables
# (a variable added after a build would otherwise be missing).
# Then: migrate this app's own database, create the login from
# ADMIN_EMAIL / ADMIN_PASSWORD if missing, run the scheduler (health pings
# every minute) in a restart loop, and serve with 4 workers.
cmd = "php artisan config:cache && php artisan route:cache && php artisan view:cache; php artisan migrate --force; php artisan app:ensure-admin; (while true; do php artisan schedule:work --whisper; sleep 5; done) & PHP_CLI_SERVER_WORKERS=4 php artisan serve --host 0.0.0.0 --port $PORT --no-reload"
